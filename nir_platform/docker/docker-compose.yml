services:
  # Django Web Application
  django:
    build:
      context: ..
      dockerfile: docker/Dockerfile.django
    container_name: nir_django
    ports:
      - "8000:8000"
    volumes:
      - ../django_app:/app
      - ../uploads:/app/uploads
      - ../reports:/app/reports
    environment:
      - DJANGO_SETTINGS_MODULE=nir_platform.settings
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nir_db
      - QDRANT_URL=http://qdrant:6333
      - FAISS_PATH=/app/faiss_index
      - OLLAMA_URL=http://ollama:11434
      - N8N_URL=http://n8n:5678
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - nir_network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nir_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=nir_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - nir_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: nir_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nir_network
    restart: unless-stopped

  # Ollama with Mistral Model
  ollama:
    image: ollama/ollama:latest
    container_name: nir_ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nir_network
    restart: unless-stopped

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: nir_n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=nir2024
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
    networks:
      - nir_network
    restart: unless-stopped

  # MCP Server
  mcp_server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    container_name: nir_mcp
    ports:
      - "8001:8000"
    volumes:
      - ../agents:/app/agents
      - ../configs:/app/configs
    environment:
      - MCP_PORT=8000
      - CREWAI_CONFIG=/app/configs/crewai_config.yaml
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nir_db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - nir_network
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  n8n_data:

networks:
  nir_network:
    driver: bridge
