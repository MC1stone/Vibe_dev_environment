services:
  # Qdrant Vector Database (replaces out-of-scope Weaviate)
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nir_network

  # PostgreSQL Database
  postgresql:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "nir_user"
      POSTGRES_PASSWORD: "Kooky0-Hatching1-Mullets2-Ninetieth7-Shimmer6-Crayon4-Flashily2"
      POSTGRES_DB: "nir_mistral"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - nir_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nir_user -d nir_mistral"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FAISS Similarity Search (simulated service)
  faiss:
    image: python:3.12-slim
    command: tail -f /dev/null
    ports:
      - "8081:8081"
    volumes:
      - ./data/faiss_index:/app/index
    working_dir: /app
    networks:
      - nir_network

  # ILIAS e-learning platform in its own container (roadmap S8)
  ilias:
    image: srsolutions/ilias:9-php8.2-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - ILIAS_AUTO_SETUP=${ILIAS_AUTO_SETUP:-1}
      - ILIAS_DB_USER=${ILIAS_DB_USER:-ilias}
      - ILIAS_DB_PASSWORD=${ILIAS_DB_PASSWORD:-ilias_change_me}
      - ILIAS_DB_NAME=${ILIAS_DB_NAME:-ilias_nir}
      - ILIAS_DB_HOST=ilias_db
      - ILIAS_DB_PORT=3306
      - ILIAS_CLIENT_ID=${ILIAS_CLIENT_ID:-nir_ip}
      - ILIAS_HTTP_PATH=${ILIAS_HTTP_PATH:-http://localhost:8080}
      - ILIAS_ROOT_USER_LOGIN=${ILIAS_ROOT_USER_LOGIN:-root}
      - ILIAS_ROOT_USER_PASSWORD=${ILIAS_ROOT_USER_PASSWORD:-ilias_root_change_me}
      - ILIAS_OVERWRITE_DB_CONFIG=${ILIAS_OVERWRITE_DB_CONFIG:-0}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ilias_data:/var/www/html
      - ilias_extradata:/var/iliasdata
    depends_on:
      - ilias_db
    networks:
      - nir_network

  # MariaDB dedicated to ILIAS (ILIAS requires MySQL/MariaDB)
  ilias_db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${ILIAS_MYSQL_ROOT_PASSWORD:-ilias_root_change_me}
      - MYSQL_DATABASE=${ILIAS_DB_NAME:-ilias_nir}
      - MYSQL_USER=${ILIAS_DB_USER:-ilias}
      - MYSQL_PASSWORD=${ILIAS_DB_PASSWORD:-ilias_change_me}
    volumes:
      - ilias_db_data:/var/lib/mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --innodb_strict_mode=0
    networks:
      - nir_network

  # Napari headless visualization server (roadmap S5, integrated from HANDHELD/napari_app)
  napari_server:
    build: ./services/napari_server
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-localhost}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - NAPARI_SERVER_PORT=8002
    networks:
      - nir_network

  # MCP Server for tool integration
  mcp_server:
    image: python:3.12-slim
    command: tail -f /dev/null
    ports:
      - "8082:8082"
    volumes:
      - ./scripts:/app/scripts
    working_dir: /app
    networks:
      - nir_network

  # Flower Federated Learning Server
  flower_server:
    image: python:3.12-slim
    command: tail -f /dev/null
    ports:
      - "5555:5555"
      - "5556:5556"
    volumes:
      - ./scripts:/app/scripts
    working_dir: /app
    networks:
      - nir_network

  # Django Web Application
  django_app:
    build:
      context: .
      dockerfile: Dockerfile.django
    working_dir: /app
    command: sh -c "python django_project/manage.py migrate && python django_project/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app:/app/agents
      - DJANGO_SETTINGS_MODULE=nir_web.settings
      - DEBUG=1
      - DATABASE_URL=postgres://nir_user:Kooky0-Hatching1-Mullets2-Ninetieth7-Shimmer6-Crayon4-Flashily2@postgresql:5432/nir_mistral
      - DJANGO_DB_ENGINE=postgresql
      - DJANGO_DB_NAME=nir_mistral
      - DJANGO_DB_USER=nir_user
      - DJANGO_DB_PASSWORD=Kooky0-Hatching1-Mullets2-Ninetieth7-Shimmer6-Crayon4-Flashily2
      - DJANGO_DB_HOST=postgresql
      - DJANGO_DB_PORT=5432
      - NIR_FRAMEWORK_PATH=/app
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,::1,*
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - nir_network

  # Quarto Documentation Server (disabled - using host installation)
  # quarto_server:
  #   image: quartobio/quarto-cli:1.3.0
  #   command: tail -f /dev/null
  #   ports:
  #     - "8083:8083"
  #   volumes:
  #     - ./reports:/app/reports
  #     - ./data:/app/data
  #   working_dir: /app
  #   networks:
  #     - nir_network

  # Ollama for Local AI (Mistral Model)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Networks
networks:
  nir_network:
    driver: bridge

# Volumes
volumes:
  qdrant_data:
    driver: local
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local
  ilias_data:
    driver: local
  ilias_extradata:
    driver: local
  ilias_db_data:
    driver: local