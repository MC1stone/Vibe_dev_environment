services:
  # Qdrant Vector Database (replaces out-of-scope Weaviate)
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nir_network

  # PostgreSQL Database
  postgresql:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "nir_user"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nir_password_change_me}"
      POSTGRES_DB: "nir_mistral"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - nir_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nir_user -d nir_mistral"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FAISS Similarity Search (simulated service)
  faiss:
    image: python:3.12-slim
    command: tail -f /dev/null
    ports:
      - "8081:8081"
    volumes:
      - ./data/faiss_index:/app/index
    working_dir: /app
    networks:
      - nir_network

  # ILIAS e-learning platform in its own container (roadmap S8)
  ilias:
    image: srsolutions/ilias:9-php8.2-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - ILIAS_AUTO_SETUP=${ILIAS_AUTO_SETUP:-1}
      - ILIAS_DB_USER=${ILIAS_DB_USER:-ilias}
      - ILIAS_DB_PASSWORD=${ILIAS_DB_PASSWORD:-ilias_change_me}
      - ILIAS_DB_NAME=${ILIAS_DB_NAME:-ilias_nir}
      - ILIAS_DB_HOST=ilias_db
      - ILIAS_DB_PORT=3306
      - ILIAS_CLIENT_ID=${ILIAS_CLIENT_ID:-nir_ip}
      - ILIAS_HTTP_PATH=${ILIAS_HTTP_PATH:-http://localhost:8080}
      - ILIAS_ROOT_USER_LOGIN=${ILIAS_ROOT_USER_LOGIN:-root}
      - ILIAS_ROOT_USER_PASSWORD=${ILIAS_ROOT_USER_PASSWORD:-ilias_root_change_me}
      - ILIAS_OVERWRITE_DB_CONFIG=${ILIAS_OVERWRITE_DB_CONFIG:-0}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ilias_data:/var/www/html
      - ilias_extradata:/var/iliasdata
    depends_on:
      ilias_db:
        condition: service_healthy
    networks:
      - nir_network

  # MariaDB dedicated to ILIAS (ILIAS requires MySQL/MariaDB)
  ilias_db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${ILIAS_MYSQL_ROOT_PASSWORD:-ilias_root_change_me}
      - MYSQL_DATABASE=${ILIAS_DB_NAME:-ilias_nir}
      - MYSQL_USER=${ILIAS_DB_USER:-ilias}
      - MYSQL_PASSWORD=${ILIAS_DB_PASSWORD:-ilias_change_me}
    volumes:
      - ilias_db_data:/var/lib/mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --innodb_strict_mode=0
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - nir_network

  # Napari headless visualization server (roadmap S5, integrated from HANDHELD/napari_app)
  napari_server:
    build: ./services/napari_server
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-localhost}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - NAPARI_SERVER_PORT=8002
    networks:
      - nir_network

  # MCP Server for tool integration
  mcp_server:
    image: python:3.12-slim
    command: tail -f /dev/null
    ports:
      - "8082:8082"
    volumes:
      - ./scripts:/app/scripts
    working_dir: /app
    networks:
      - nir_network

  # Flower Federated Learning Server (FL1: SuperLink transport)
  flower_server:
    image: python:3.12-slim
    command: sh -c "pip install --no-cache-dir 'flwr>=1.4.0' numpy > /dev/null 2>&1; python scripts/flower_superlink_entry.py"
    ports:
      - "5555:5555"
      - "5556:5556"
      - "9091:9091"
      - "9092:9092"
    volumes:
      - ./services:/app/services
      - ./agents:/app/agents
      - ./scripts:/app/scripts
    working_dir: /app
    networks:
      - nir_network
  # Federated learning client node (FL1: one SuperNode per group)
  flower_client:
    image: python:3.12-slim
    command: sh -c "pip install --no-cache-dir 'flwr>=1.4.0' numpy > /dev/null 2>&1; python scripts/flower_supernode_entry.py"
    volumes:
      - ./services:/app/services
      - ./agents:/app/agents
      - ./scripts:/app/scripts
    working_dir: /app
    environment:
      - FLOWER_SUPERLINK_ADDRESS=flower_server:9092
      - FLOWER_CLIENT_GROUP=sparkfun_triad
    depends_on:
      - flower_server
    networks:
      - nir_network

  # Django Web Application
  django_app:
    build:
      context: .
      dockerfile: Dockerfile.django
    working_dir: /app
    command: sh -c "python django_project/manage.py migrate && python django_project/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app:/app/agents
      - DJANGO_SETTINGS_MODULE=nir_web.settings
      - DEBUG=1
      - DATABASE_URL=postgres://nir_user:${POSTGRES_PASSWORD:-nir_password_change_me}@postgresql:5432/nir_mistral
      - DJANGO_DB_ENGINE=postgresql
      - DJANGO_DB_NAME=nir_mistral
      - DJANGO_DB_USER=nir_user
      - DJANGO_DB_PASSWORD=${POSTGRES_PASSWORD:-nir_password_change_me}
      - DJANGO_DB_HOST=postgresql
      - DJANGO_DB_PORT=5432
      - NIR_FRAMEWORK_PATH=/app
      - OLLAMA_URL=http://ollama:11434
      - NIR_LLM_MODEL=${NIR_LLM_MODEL:-mistral}
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,::1,*
    depends_on:
      postgresql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - nir_network

  # Background crew runner (OP6): the agent crew operates the platform
  # interfaces (Django, PostgreSQL, Qdrant, ILIAS, MCP) in the background.
  background_crew:
    build:
      context: .
      dockerfile: Dockerfile.django
    working_dir: /app
    command: python scripts/background_crew_runner.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app:/app/agents
      - DJANGO_DB_HOST=postgresql
      - DJANGO_DB_PORT=5432
      - OLLAMA_URL=http://ollama:11434
      - NIR_LLM_MODEL=${NIR_LLM_MODEL:-mistral}
    depends_on:
      postgresql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nir_network

  # ILIAS course development agent in its own container (FL5 follow-up):
  # continuously develops NIR curricula and syncs them to the ILIAS container
  ilias_course_agent:
    build:
      context: .
      dockerfile: Dockerfile.django
    working_dir: /app
    command: python scripts/ilias_course_agent_runner.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app:/app/agents
      - ILIAS_URL=http://ilias:80
      - ILIAS_API_CLIENT_ID=${ILIAS_API_CLIENT_ID:-}
      - ILIAS_API_CLIENT_SECRET=${ILIAS_API_CLIENT_SECRET:-}
    depends_on:
      - ilias
    restart: unless-stopped
    networks:
      - nir_network

  # Quarto Documentation Server (disabled - using host installation)
  # quarto_server:
  #   image: quartobio/quarto-cli:1.3.0
  #   command: tail -f /dev/null
  #   ports:
  #     - "8083:8083"
  #   volumes:
  #     - ./reports:/app/reports
  #     - ./data:/app/data
  #   working_dir: /app
  #   networks:
  #     - nir_network

  # Ollama for Local AI (Mistral Model)
  ollama:
    image: ollama/ollama:latest
    container_name: nir_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # One-shot model loader (OP50b): guarantees the configured models are
  # present in the ollama volume, so no chat call ever triggers an implicit
  # multi-GB pull (which no read timeout can cover). Runs after ollama is
  # healthy; pulls only what is missing (idempotent, safe to re-run).
  ollama_init:
    image: ollama/ollama:latest
    container_name: nir_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      NIR_LLM_MODEL: ${NIR_LLM_MODEL:-mistral}
      NIR_EMBEDDING_MODEL: ${NIR_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "ollama_init: sicherstelle Modelle ..."
        for m in "$${NIR_LLM_MODEL}" "$${NIR_EMBEDDING_MODEL}"; do
          fam=$${m%%:*}
          if ollama list 2>/dev/null | awk 'NR>1 {print $$1}' | cut -d: -f1 | grep -qx "$${fam}"; then
            echo "ollama_init: $${m} bereits vorhanden"
          else
            echo "ollama_init: lade $${m} (einmalig, mehrere GB moeglich)"
            ollama pull "$${m}"
          fi
        done
        echo "ollama_init: Modelle bereit"
        ollama list
    restart: "no"
    networks:
      - nir_network

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Networks
networks:
  nir_network:
    driver: bridge

# Volumes
volumes:
  qdrant_data:
    driver: local
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local
  ilias_data:
    driver: local
  ilias_extradata:
    driver: local
  ilias_db_data:
    driver: local