<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 830" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="830" fill="#f8fafc"/>

  <text x="590" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">NIR Intelligence Platform – der Aufbau einfach erklärt</text>
  <text x="590" y="70" text-anchor="middle" font-size="14" fill="#475569">Wie ein Labor-Team: Messdaten rein → Spezialisten analysieren → fertiger Bericht raus</text>

  <!-- Docker container -->
  <rect x="200" y="95" width="980" height="615" rx="16" fill="#eff6ff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="220" y="118" font-size="13" font-weight="bold" fill="#475569">Docker: Die ganze Plattform läuft in isolierten "Boxen" (Containern) – auf jedem Rechner gleich.</text>

  <!-- User -->
  <rect x="570" y="130" width="240" height="50" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="690" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Forschende &amp; Studierende</text>

  <line x1="690" y1="180" x2="690" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Django -->
  <rect x="460" y="205" width="460" height="50" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="690" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Web-Oberfläche (Django): Daten hochladen, Spektren ansehen, Chatbot fragen</text>

  <line x1="690" y1="255" x2="690" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Master agent -->
  <rect x="470" y="280" width="440" height="50" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="690" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Master-Agent (Teamleitung): verteilt Aufgaben und prüft die Qualität</text>

  <!-- Distribution bar master -> agents -->
  <line x1="690" y1="330" x2="690" y2="345" stroke="#475569" stroke-width="2"/>
  <line x1="285" y1="345" x2="1085" y2="345" stroke="#475569" stroke-width="2"/>
  <line x1="285" y1="345" x2="285" y2="358" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="345" x2="445" y2="358" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="605" y1="345" x2="605" y2="358" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="765" y1="345" x2="765" y2="358" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="925" y1="345" x2="925" y2="358" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1085" y1="345" x2="1085" y2="358" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Specialist agents -->
  <rect x="210" y="360" width="150" height="115" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="285" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">Daten-Agent</text>
  <text x="285" y="404" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Rohdaten importieren,</text>
  <text x="285" y="421" text-anchor="middle" font-size="11.5" fill="#0c4a6e">bereinigen und</text>
  <text x="285" y="438" text-anchor="middle" font-size="11.5" fill="#0c4a6e">normalisieren</text>

  <rect x="370" y="360" width="150" height="115" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="445" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">Qualitäts-Agent</text>
  <text x="445" y="404" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Sensor und Daten-</text>
  <text x="445" y="421" text-anchor="middle" font-size="11.5" fill="#0c4a6e">qualität prüfen</text>
  <text x="445" y="438" text-anchor="middle" font-size="11.5" fill="#0c4a6e">(Drift, Rauschen)</text>

  <rect x="530" y="360" width="150" height="115" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="605" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">Statistik-Agent</text>
  <text x="605" y="404" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Klassische Analyse:</text>
  <text x="605" y="421" text-anchor="middle" font-size="11.5" fill="#0c4a6e">PCA, PLS, ANOVA,</text>
  <text x="605" y="438" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Clusteranalyse</text>

  <rect x="690" y="360" width="150" height="115" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="765" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">KI-Agent</text>
  <text x="765" y="404" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Neuronale Netze:</text>
  <text x="765" y="421" text-anchor="middle" font-size="11.5" fill="#0c4a6e">CNN, MLP,</text>
  <text x="765" y="438" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Autoencoder</text>

  <rect x="850" y="360" width="150" height="115" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="925" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">Kalibrations-Agent</text>
  <text x="925" y="404" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Messmodelle bauen</text>
  <text x="925" y="421" text-anchor="middle" font-size="11.5" fill="#0c4a6e">und automatisch</text>
  <text x="925" y="438" text-anchor="middle" font-size="11.5" fill="#0c4a6e">optimieren</text>

  <rect x="1010" y="360" width="150" height="115" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1085" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">Berichts-Agent</text>
  <text x="1085" y="404" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Berichte und</text>
  <text x="1085" y="421" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Diagramme erzeugen</text>
  <text x="1085" y="438" text-anchor="middle" font-size="11.5" fill="#0c4a6e">(Quarto)</text>

  <!-- Bar agents -> storage -->
  <line x1="285" y1="475" x2="285" y2="497" stroke="#475569" stroke-width="2"/>
  <line x1="445" y1="475" x2="445" y2="497" stroke="#475569" stroke-width="2"/>
  <line x1="605" y1="475" x2="605" y2="497" stroke="#475569" stroke-width="2"/>
  <line x1="765" y1="475" x2="765" y2="497" stroke="#475569" stroke-width="2"/>
  <line x1="925" y1="475" x2="925" y2="497" stroke="#475569" stroke-width="2"/>
  <line x1="1085" y1="475" x2="1085" y2="497" stroke="#475569" stroke-width="2"/>
  <line x1="340" y1="497" x2="1036" y2="497" stroke="#475569" stroke-width="2"/>
  <line x1="340" y1="497" x2="340" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="572" y1="497" x2="572" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="804" y1="497" x2="804" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1036" y1="497" x2="1036" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Storage row -->
  <rect x="230" y="520" width="220" height="105" rx="10" fill="#f3e8ff" stroke="#7e22d3" stroke-width="2"/>
  <text x="340" y="543" text-anchor="middle" font-size="13" font-weight="bold" fill="#581c87">PostgreSQL</text>
  <text x="340" y="565" text-anchor="middle" font-size="11.5" fill="#6b21a8">Metadaten-Ablage:</text>
  <text x="340" y="582" text-anchor="middle" font-size="11.5" fill="#6b21a8">wie ein Karteikasten</text>
  <text x="340" y="599" text-anchor="middle" font-size="11.5" fill="#6b21a8">für alle Messdaten</text>

  <rect x="462" y="520" width="220" height="105" rx="10" fill="#f3e8ff" stroke="#7e22d3" stroke-width="2"/>
  <text x="572" y="543" text-anchor="middle" font-size="13" font-weight="bold" fill="#581c87">Qdrant</text>
  <text x="572" y="565" text-anchor="middle" font-size="11.5" fill="#6b21a8">Vektor-Datenbank:</text>
  <text x="572" y="582" text-anchor="middle" font-size="11.5" fill="#6b21a8">speichert Bedeutungen</text>
  <text x="572" y="599" text-anchor="middle" font-size="11.5" fill="#6b21a8">für die KI-Suche</text>

  <rect x="694" y="520" width="220" height="105" rx="10" fill="#f3e8ff" stroke="#7e22d3" stroke-width="2"/>
  <text x="804" y="543" text-anchor="middle" font-size="13" font-weight="bold" fill="#581c87">FAISS</text>
  <text x="804" y="565" text-anchor="middle" font-size="11.5" fill="#6b21a8">Ähnlichkeits-Suche:</text>
  <text x="804" y="582" text-anchor="middle" font-size="11.5" fill="#6b21a8">findet gleiche und</text>
  <text x="804" y="599" text-anchor="middle" font-size="11.5" fill="#6b21a8">ähnliche Spektren</text>

  <rect x="926" y="520" width="220" height="105" rx="10" fill="#f3e8ff" stroke="#7e22d3" stroke-width="2"/>
  <text x="1036" y="543" text-anchor="middle" font-size="13" font-weight="bold" fill="#581c87">Ollama + Mistral</text>
  <text x="1036" y="565" text-anchor="middle" font-size="11.5" fill="#6b21a8">Lokales KI-Sprachmodell:</text>
  <text x="1036" y="582" text-anchor="middle" font-size="11.5" fill="#6b21a8">der Chatbot läuft auf dem</text>
  <text x="1036" y="599" text-anchor="middle" font-size="11.5" fill="#6b21a8">eigenen Rechner – ohne Cloud</text>

  <text x="690" y="672" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">Wichtig: Alles läuft lokal auf dem eigenen Rechner/Server – keine Cloud, keine Daten verlassen das Haus.</text>

  <!-- Spectrometer input -->
  <rect x="20" y="395" width="155" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="97" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">NIR-Spektrometer</text>
  <text x="97" y="440" text-anchor="middle" font-size="11.5" fill="#991b1b">Das Messgerät liefert</text>
  <text x="97" y="457" text-anchor="middle" font-size="11.5" fill="#991b1b">Rohdaten</text>
  <text x="97" y="474" text-anchor="middle" font-size="11.5" fill="#991b1b">(CSV, JSON, HDF5 …)</text>
  <line x1="175" y1="450" x2="208" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom flow strip -->
  <text x="590" y="737" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">Der Datenfluss in Kürze – drei Schritte:</text>
  <line x1="690" y1="710" x2="690" y2="745" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>

  <rect x="60" y="745" width="250" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="185" y="770" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">1. NIR-Spektrometer</text>
  <text x="185" y="790" text-anchor="middle" font-size="11.5" fill="#991b1b">Rohdaten (Messwerte) rein</text>

  <line x1="310" y1="775" x2="378" y2="775" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="745" width="420" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="590" y="770" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">2. NIR Intelligence Platform</text>
  <text x="590" y="790" text-anchor="middle" font-size="11.5" fill="#1e40af">Das Agenten-Team oben analysiert, prüft und optimiert</text>

  <line x1="800" y1="775" x2="868" y2="775" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="870" y="745" width="250" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="995" y="770" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">3. Ergebnis-Bericht</text>
  <text x="995" y="790" text-anchor="middle" font-size="11.5" fill="#9a3412">Quarto: PDF &amp; Web, mit Empfehlungen</text>
</svg>
