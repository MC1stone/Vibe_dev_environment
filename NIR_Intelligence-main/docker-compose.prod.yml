# NIR_MISTRAL Production Docker Compose Configuration
# This file provides a production-ready setup with all required services
# Usage: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # Django Web Application (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nir_mistral_web
    restart: unless-stopped
    command: gunicorn django_project.nir_web.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 300
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=nir_web.settings
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://nir_user:${POSTGRES_PASSWORD}@postgres:5432/nir_mistral
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - QUARTO_ENABLED=True
      - QUARTO_PATH=/usr/bin/quarto
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker for Async Tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nir_mistral_celery
    restart: unless-stopped
    command: celery -A django_project.nir_web worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=nir_web.settings
      - DATABASE_URL=postgres://nir_user:${POSTGRES_PASSWORD}@postgres:5432/nir_mistral
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
      - web
    networks:
      - nir_network

  # Celery Beat for Scheduled Tasks
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nir_mistral_celery_beat
    restart: unless-stopped
    command: celery -A django_project.nir_web beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=nir_web.settings
      - DATABASE_URL=postgres://nir_user:${POSTGRES_PASSWORD}@postgres:5432/nir_mistral
    depends_on:
      - postgres
      - redis
      - web
    networks:
      - nir_network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nir_mistral_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nir_mistral
      POSTGRES_USER: nir_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nir_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - nir_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nir_user -d nir_mistral"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database (replaces out-of-scope Weaviate)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nir_mistral_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nir_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':< /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Faiss Similarity Search Service
  faiss:
    image: python:3.10-slim
    container_name: nir_mistral_faiss
    restart: unless-stopped
    command: python /app/services/faiss_server.py
    ports:
      - "8081:8081"
    volumes:
      - ./services:/app/services
      - ./data/faiss_index:/app/index
    working_dir: /app
    environment:
      - FAISS_INDEX_PATH=/app/index
      - FAISS_PORT=8081
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8081/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Ollama with Mistral Model
  ollama:
    image: ollama/ollama:latest
    container_name: nir_mistral_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for Caching and Task Queue
  redis:
    image: redis:7-alpine
    container_name: nir_mistral_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Napari headless visualization server (roadmap S5, integrated from HANDHELD/napari_app)
  # ILIAS e-learning platform in its own container (roadmap S8)
  ilias:
    image: srsolutions/ilias:9-php8.2-apache
    container_name: nir_mistral_ilias
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - ILIAS_AUTO_SETUP=${ILIAS_AUTO_SETUP:-1}
      - ILIAS_DB_USER=${ILIAS_DB_USER:-ilias}
      - ILIAS_DB_PASSWORD=${ILIAS_DB_PASSWORD:-ilias_change_me}
      - ILIAS_DB_NAME=${ILIAS_DB_NAME:-ilias_nir}
      - ILIAS_DB_HOST=ilias_db
      - ILIAS_DB_PORT=3306
      - ILIAS_CLIENT_ID=${ILIAS_CLIENT_ID:-nir_ip}
      - ILIAS_HTTP_PATH=${ILIAS_HTTP_PATH:-http://localhost:8080}
      - ILIAS_ROOT_USER_LOGIN=${ILIAS_ROOT_USER_LOGIN:-root}
      - ILIAS_ROOT_USER_PASSWORD=${ILIAS_ROOT_USER_PASSWORD:-ilias_root_change_me}
      - ILIAS_OVERWRITE_DB_CONFIG=${ILIAS_OVERWRITE_DB_CONFIG:-0}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ilias_data:/var/www/html
      - ilias_extradata:/var/iliasdata
    depends_on:
      - ilias_db
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nir_network

  # MariaDB dedicated to ILIAS (ILIAS requires MySQL/MariaDB)
  ilias_db:
    image: mariadb:10.11
    container_name: nir_mistral_ilias_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${ILIAS_MYSQL_ROOT_PASSWORD:-ilias_root_change_me}
      - MYSQL_DATABASE=${ILIAS_DB_NAME:-ilias_nir}
      - MYSQL_USER=${ILIAS_DB_USER:-ilias}
      - MYSQL_PASSWORD=${ILIAS_DB_PASSWORD:-ilias_change_me}
    volumes:
      - ilias_db_data:/var/lib/mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --innodb_strict_mode=0
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nir_network

  napari_server:
    build: ./services/napari_server
    container_name: nir_mistral_napari
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-localhost}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - NAPARI_SERVER_PORT=8002
    networks:
      - nir_network

  # Quarto for Report Generation
  quarto:
    image: quartobio/quarto-cli:1.3.0
    container_name: nir_mistral_quarto
    restart: unless-stopped
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./django_project/templates/reports:/app/templates
    working_dir: /app
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "quarto", "--version"]
      interval: 20s
      timeout: 5s
      retries: 3

  # Flower Federated Learning Server
  flower_server:
    image: python:3.10-slim
    container_name: nir_mistral_flower
    restart: unless-stopped
    command: python /app/services/flower_server.py
    ports:
      - "5555:5555"
      - "5556:5556"
    volumes:
      - ./services:/app/services
      - ./data:/app/data
    working_dir: /app
    environment:
      - FLOWER_SERVER_HOST=0.0.0.0
      - FLOWER_SERVER_PORT=5555
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5555/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Nginx Reverse Proxy (Optional for production)
  nginx:
    image: nginx:1.25-alpine
    container_name: nir_mistral_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./static:/var/www/static
      - ./media:/var/www/media
      - ./certs:/etc/nginx/certs
    depends_on:
      - web
    networks:
      - nir_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Monitoring with Prometheus and Grafana
  prometheus:
    image: prom/prometheus:latest
    container_name: nir_mistral_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - nir_network

  grafana:
    image: grafana/grafana:latest
    container_name: nir_mistral_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - nir_network

# Networks
networks:
  nir_network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local
  ilias_data:
    driver: local
  ilias_extradata:
    driver: local
  ilias_db_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local