---
# ============================================================================
# NIR Intelligence Main - Installation auf frisch installiertem Debian 13
# ============================================================================
# Installiert die Eigenentwicklung "NIR Intelligence Main" von einem
# Ventoy-Stick aus. Zwei Methoden werden unterstuetzt:
#
#   1. .deb-Paket : /mnt/ventoy/ansible/nir_intelligence_main.deb
#   2. Archiv     : /mnt/ventoy/ansible/nir_intelligence_main.tar.gz
#                   -> nach /opt/nir_intelligence entpacken und
#                      /opt/nir_intelligence/install.sh ausfuehren
#
# Das Playbook ist idempotent: mehrfaches Ausfuehren fuehrt zum gleichen
# Ergebnis. Die Installationsmethode wird automatisch gewaehlt - bevorzugt
# wird das .deb-Paket, falls vorhanden.
#
# Ausfuehrung (nach der Debian-Installation, Ventoy-Stick eingehaengt):
#   ansible-playbook -i localhost, -c local install_nir_intelligence.yml \
#       --ask-become-pass
# ============================================================================

- name: NIR Intelligence Main - Installation auf Debian 13 (Ventoy-Stick)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # ---- Quellpfade auf dem Ventoy-Stick ---------------------------------
    ventoy_mount: "/mnt/ventoy"
    ventoy_ansible_dir: "{{ ventoy_mount }}/ansible"
    deb_path: "{{ ventoy_ansible_dir }}/nir_intelligence_main.deb"
    archive_path: "{{ ventoy_ansible_dir }}/nir_intelligence_main.tar.gz"

    # ---- Installationsziele ----------------------------------------------
    deb_staging_dir: "/tmp"
    deb_staging_path: "{{ deb_staging_dir }}/nir_intelligence_main.deb"
    opt_install_dir: "/opt/nir_intelligence"
    archive_staging_path: "/opt/nir_intelligence_main.tar.gz"

    # ---- Pakete ------------------------------------------------------------
    required_packages:
      - python3
      - wget
      - git
      - unzip

    # ---- Dienst ------------------------------------------------------------
    service_name: "nir_intelligence"
    service_check_enabled: true

    # ---- Docker (OP59a: Pflicht, nicht optional) ----------------------------
    # Ohne Docker gibt es keinen Backend-Stack und damit keine KI-Analysen
    # (Ollama/Mistral, Qdrant, Redis) - genau das soll der Release vermeiden.
    # Die Installation erfolgt nur, wenn Docker/Compose fehlen (idempotent).
    docker_packages:
      - docker.io
      - docker-compose-v2

    # ---- Verifikation (OP59b: Ende-zu-Ende) --------------------------------
    verify_command: "systemctl is-active {{ service_name }}"
    verify_timeout: 30
    app_wait_timeout: 60
    docker_wait_timeout: 60
    llm_model: "mistral:latest"

    # ---- Pre-Flight ----------------------------------------------------------
    # Maximale Wartezeit in Sekunden je stat-Check. Ein haengender Mount
    # (z. B. defekter/entfernter USB-Stick, der noch als gemountet
    # registriert ist) blockiert jeden Dateizugriff - ohne Timeout steht
    # das Playbook still. Bei Ueberschreitung bricht der Pre-Flight mit
    # klarer Meldung ab statt endlos zu warten.
    preflight_timeout: 10

  tasks:
    # ==========================================================================
    # 0. Pre-Flight-Checks: Ventoy-Stick und Installationsquelle vorhanden
    # ==========================================================================
    # Die stat-Checks laufen mit Timeout: ein haengender Mount (z. B.
    # entfernte/defekte USB-Medien, die noch als gemountet registriert sind)
    # blockiert jeden Dateizugriff im Kernel (D-State). Ohne Timeout steht
    # das Playbook dann still; mit Timeout bricht der Pre-Flight nach
    # preflight_timeout Sekunden mit klarer Diagnose ab.
    - name: Pre-Flight-Checks gegen haengende Mounts absichern
      block:
        - name: Pruefe, ob der Ventoy-Stick eingehaengt ist
          ansible.builtin.stat:
            path: "{{ ventoy_mount }}"
          async: "{{ preflight_timeout }}"
          poll: 1
          register: ventoy_mount_state

        - name: Pruefe, ob das .deb-Paket auf dem Stick liegt
          ansible.builtin.stat:
            path: "{{ deb_path }}"
          async: "{{ preflight_timeout }}"
          poll: 1
          register: deb_file_state

        - name: Pruefe, ob das Archiv auf dem Stick liegt
          ansible.builtin.stat:
            path: "{{ archive_path }}"
          async: "{{ preflight_timeout }}"
          poll: 1
          register: archive_file_state

      rescue:
        - name: Pre-Flight wegen haengender Dateizugriffe abgebrochen
          ansible.builtin.fail:
            msg: >-
              Die Pre-Flight-Checks konnten {{ ventoy_mount }} (oder die
              Installationsquelle darauf) innerhalb von
              {{ preflight_timeout }} Sekunden nicht erreichen. Der
              Mount haengt vermutlich im Kernel (z. B. entfernte/defekte
              USB-Medien). Diagnose auf dem Zielsystem:
              mount | grep -i ventoy, timeout {{ preflight_timeout }}
              stat {{ ventoy_mount }}, lsblk -f. Danach den Stick neu
              mounten und das Playbook erneut ausfuehren.

    # Die erwarteten Abbrueche liegen bewusst NACH dem Block: der rescue
    # greift bei jedem Fehler im Block - die klaren OP26-Meldungen duerfen
    # nicht von der Timeout-Diagnose ueberschrieben werden.
    - name: Breche ab, wenn der Ventoy-Stick nicht eingehaengt ist
      ansible.builtin.fail:
        msg: >-
          Der Ventoy-Stick ist nicht unter {{ ventoy_mount }} eingehaengt.
          Bitte den Stick mounten und das Playbook erneut ausfuehren.
      when: not ventoy_mount_state.stat.exists

    - name: Breche ab, wenn weder .deb-Paket noch Archiv gefunden wurden
      ansible.builtin.fail:
        msg: >-
          Weder {{ deb_path }} noch {{ archive_path }} wurden gefunden.
          Bitte die Eigenentwicklung auf den Ventoy-Stick kopieren.
      when: not deb_file_state.stat.exists and not archive_file_state.stat.exists

    - name: Festlegung der Installationsmethode
      ansible.builtin.set_fact:
        install_method: "{{ 'deb' if deb_file_state.stat.exists else 'archive' }}"

    - name: Installationsmethode bekanntgeben
      ansible.builtin.debug:
        msg: "Installationsmethode: {{ install_method }}"

    # ==========================================================================
    # 1. Paketindex aktualisieren und Abhaengigkeiten installieren
    # ==========================================================================
    - name: Aktualisiere den Paketindex (apt update)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installiere Abhaengigkeiten
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present

    # ==========================================================================
    # 2a. Installationsmethode: .deb-Paket
    # ==========================================================================
    - name: .deb-Paket installieren
      when: install_method == 'deb'
      block:
        - name: Kopiere das .deb-Paket nach /tmp
          ansible.builtin.copy:
            src: "{{ deb_path }}"
            dest: "{{ deb_staging_path }}"
            mode: "0644"
            remote_src: true

        - name: Entferne eine vorhandene Paketversion (garantiert Neuinstallation)
          ansible.builtin.apt:
            name: nir-intelligence-main
            state: absent
            purge: true

        - name: Installiere das .deb-Paket mit apt
          ansible.builtin.apt:
            deb: "{{ deb_staging_path }}"
            state: present
          register: deb_install_result

        - name: Entferne das .deb-Paket aus /tmp
          ansible.builtin.file:
            path: "{{ deb_staging_path }}"
            state: absent
          when: deb_install_result is succeeded

      rescue:
        - name: Installation des .deb-Pakets fehlgeschlagen
          ansible.builtin.fail:
            msg: >-
              Die Installation des .deb-Pakets ist fehlgeschlagen.
              Bitte die Paketintegritaet pruefen
              (dpkg-deb --info {{ deb_staging_path }}) und das
              Playbook erneut ausfuehren.

    # ==========================================================================
    # 2b. Installationsmethode: Archiv mit install.sh
    # ==========================================================================
    - name: Archiv installieren
      when: install_method == 'archive'
      block:
        - name: Kopiere das Archiv nach /opt
          ansible.builtin.copy:
            src: "{{ archive_path }}"
            dest: "{{ archive_staging_path }}"
            mode: "0644"
            remote_src: true

        - name: Entpacke das Archiv nach /opt/nir_intelligence
          ansible.builtin.unarchive:
            src: "{{ archive_staging_path }}"
            dest: "{{ opt_install_dir | dirname }}"
            remote_src: true
            creates: "{{ opt_install_dir }}/install.sh"

        - name: Pruefe, ob das Installationsskript existiert
          ansible.builtin.stat:
            path: "{{ opt_install_dir }}/install.sh"
          register: install_script_state

        - name: Breche ab, wenn install.sh fehlt
          ansible.builtin.fail:
            msg: >-
              Das Skript {{ opt_install_dir }}/install.sh wurde im Archiv
              nicht gefunden. Bitte das Archiv pruefen.
          when: not install_script_state.stat.exists

        - name: Fuehre install.sh mit Root-Rechten aus
          ansible.builtin.command:
            cmd: "bash {{ opt_install_dir }}/install.sh"
            chdir: "{{ opt_install_dir }}"
            creates: "{{ opt_install_dir }}/.install_completed"
          register: install_script_result

        - name: Entferne das Archiv aus /opt
          ansible.builtin.file:
            path: "{{ archive_staging_path }}"
            state: absent

      rescue:
        - name: Archiv-Installation fehlgeschlagen
          ansible.builtin.fail:
            msg: >-
              Die Installation aus dem Archiv ist fehlgeschlagen.
              Bitte das Archiv pruefen
              (tar -tzf {{ archive_staging_path }}) und das
              Playbook erneut ausfuehren.

    # ==========================================================================
    # 3. Dienst aktivieren und starten
    # ==========================================================================
    - name: Pruefe, ob der systemd-Dienst existiert
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ service_name }}.service"
      register: service_file_state

    - name: Lade die systemd-Konfiguration neu
      ansible.builtin.systemd:
        daemon_reload: true
      when: service_file_state.stat.exists

    - name: Aktiviere und starte den Dienst nir_intelligence
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started
      when: >
        service_file_state.stat.exists and service_check_enabled | bool
      register: service_start_result

    - name: Dienst-Name im Playbook anpassen (Hinweis, falls abweichend)
      ansible.builtin.debug:
        msg: >-
          Hinweis: Falls der systemd-Dienst anders heisst als
          '{{ service_name }}', bitte die Variable 'service_name' im
          Playbook entsprechend anpassen.
      when: not service_file_state.stat.exists

    # ==========================================================================
    # 4. Verifikation der Installation
    # ==========================================================================
    - name: Pruefe, ob der Dienst aktiv ist (Verifikation)
      ansible.builtin.command:
        cmd: "{{ verify_command }}"
      register: verify_result
      changed_when: false
      failed_when: >
        verify_result.rc != 0 and service_file_state.stat.exists
      when: >
        service_file_state.stat.exists and service_check_enabled | bool

    - name: Installation erfolgreich verifiziert
      ansible.builtin.debug:
        msg: >-
          NIR Intelligence Main wurde erfolgreich installiert
          (Methode: {{ install_method }}) und der Dienst
          '{{ service_name }}' ist aktiv.
      when: >
        service_file_state.stat.exists and service_check_enabled | bool

    # ==========================================================================
    # 5. Docker installieren (OP59a: Pflicht, nicht optional)
    # ==========================================================================
    # Ohne Docker gibt es keinen Backend-Stack (Ollama, Qdrant, Redis) und
    # damit keine KI-Analysen. Der Release verlangt Docker deshalb als
    # harte Abhaengigkeit: fehlt es, wird es per apt nachinstalliert
    # (idempotent - vorhandene Installationen werden nicht angefasst).
    - name: Pruefe, ob Docker verfuegbar ist
      ansible.builtin.command:
        cmd: "docker --version"
      register: docker_version_result
      changed_when: false
      failed_when: false

    - name: Installiere Docker und Docker Compose (apt)
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
      register: docker_install_result
      when: docker_version_result.rc != 0

    - name: Pruefe Docker erneut nach der Installation
      ansible.builtin.command:
        cmd: "docker --version"
      register: docker_version_after
      changed_when: false
      failed_when: false
      when: docker_install_result is changed

    - name: Breche ab, wenn Docker auch nach der Installation fehlt
      ansible.builtin.fail:
        msg: >-
          Docker konnte nicht installiert werden - ohne Docker gibt es
          keinen Backend-Stack (Ollama, Qdrant, Redis) und keine
          KI-Analysen. Diagnose: apt-get install -y docker.io
          docker-compose-v2; danach das Playbook erneut ausfuehren.
      when: >
        docker_install_result is changed and
        docker_version_after.rc is defined and docker_version_after.rc != 0

    - name: Stelle sicher, dass der Docker-Daemon laeuft
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Pruefe, ob Docker Compose verfuegbar ist
      ansible.builtin.command:
        cmd: "docker compose version"
      register: compose_version_result
      changed_when: false

    - name: Warte, bis der Docker-Daemon antwortet (max. {{ docker_wait_timeout }}s)
      ansible.builtin.command:
        cmd: "docker info"
      register: docker_info_result
      until: docker_info_result.rc == 0
      retries: "{{ docker_wait_timeout }}"
      delay: 1
      changed_when: false
      failed_when: false

    - name: Breche ab, wenn der Docker-Daemon nicht erreichbar ist
      ansible.builtin.fail:
        msg: >-
          Der Docker-Daemon antwortet nicht. Diagnose:
          systemctl status docker; journalctl -u docker -n 50.
          Ohne Daemon kein Backend-Stack und keine KI-Analysen.
      when: docker_info_result.rc != 0

    # ==========================================================================
    # 6. Host-Backend-Stack (OP45): Ollama, Qdrant, Redis als Docker-Container
    # ==========================================================================
    # Die systemd-Django-App laeuft auf dem Host und erreicht die Analyse-
    # Backends nur ueber localhost.
    - name: Pruefe, ob das Backend-Stack-Skript installiert wurde
      ansible.builtin.stat:
        path: "{{ opt_install_dir }}/packaging/start_backend_stack.sh"
      register: backend_script_state

    - name: Breche ab, wenn das Backend-Stack-Skript fehlt
      ansible.builtin.fail:
        msg: >-
          Das Backend-Stack-Skript fehlt unter
          {{ opt_install_dir }}/packaging/ - der Payload ist veraltet
          (OP45). Neu bauen mit packaging/build_deb.sh bzw.
          packaging/build_ventoy_stick.sh.
      when: not backend_script_state.stat.exists

    - name: Starte den Host-Backend-Stack (OP45)
      ansible.builtin.command:
        cmd: "bash {{ opt_install_dir }}/packaging/start_backend_stack.sh"
      register: backend_stack_result
      changed_when: false

    - name: Breche ab, wenn der Backend-Stack nicht startet
      ansible.builtin.fail:
        msg: >-
          Der Backend-Stack (Ollama, Qdrant, Redis) konnte nicht gestartet
          werden - ohne ihn sind alle KI-Analysen degraded. Diagnose:
          docker ps; docker logs nir_ollama; danach das Playbook erneut
          ausfuehren. {{ backend_stack_result.stderr | default('') }}
      when: backend_stack_result.rc != 0

    # ==========================================================================
    # 7. Verifikation (OP59b): Ende-zu-Ende statt nur systemctl
    # ==========================================================================
    # Ein gruenes is-active beweist noch keine funktionierende Plattform.
    # Der Release verlangt: Django antwortet, Ollama laeuft, das Modell
    # liegt bereit, Qdrant und Redis sind erreichbar. Erst dann ist die
    # Installation erfolgreich.
    - name: Pruefe, ob der Django-Dienst aktiv ist
      ansible.builtin.command:
        cmd: "systemctl is-active {{ service_name }}"
      register: django_active_result
      changed_when: false
      failed_when: false
      when: service_file_state.stat.exists and service_check_enabled | bool

    - name: Warte auf die Django-App (HTTP, max. {{ app_wait_timeout }}s)
      ansible.builtin.uri:
        url: "http://127.0.0.1:8000/"
        status_code: [200, 302]
      register: django_http_result
      until: django_http_result.status in [200, 302]
      retries: "{{ app_wait_timeout }}"
      delay: 1
      failed_when: false
      when: >
        service_file_state.stat.exists and service_check_enabled | bool and
        django_active_result.rc == 0

    - name: Pruefe Ollama auf Erreichbarkeit
      ansible.builtin.uri:
        url: "http://127.0.0.1:11434/api/tags"
        status_code: 200
      register: ollama_tags_result
      failed_when: false
      changed_when: false

    - name: Pruefe, ob das LLM-Modell vorhanden ist
      ansible.builtin.command:
        cmd: "curl -s http://127.0.0.1:11434/api/tags"
      register: ollama_models_raw
      changed_when: false
      when: ollama_tags_result.status == 200

    - name: Breche ab, wenn das LLM-Modell fehlt
      ansible.builtin.fail:
        msg: >-
          Ollama laeuft, aber das Modell '{{ llm_model }}' fehlt - die
          Analysen wuerden auf Fallback zurueckfallen. Nachladen:
          docker exec nir_ollama ollama pull {{ llm_model }}, danach das
          Playbook erneut ausfuehren.
      when: >
        ollama_tags_result.status == 200 and
        llm_model.split(':')[0] not in ollama_models_raw.stdout

    - name: Pruefe Qdrant auf Erreichbarkeit
      ansible.builtin.uri:
        url: "http://127.0.0.1:6333/healthz"
        status_code: 200
      register: qdrant_health_result
      failed_when: false
      changed_when: false

    - name: Pruefe Redis (PING)
      ansible.builtin.command:
        cmd: "docker exec nir_redis redis-cli ping"
      register: redis_ping_result
      changed_when: false
      failed_when: false

    - name: Sammle Verifikationsergebnisse
      ansible.builtin.set_fact:
        verify_checks: {
          django_service: "{{ service_file_state.stat.exists and django_active_result.rc | default(1) == 0 }}",
          django_http: "{{ django_http_result.status | default(0) in [200, 302] }}",
          ollama: "{{ ollama_tags_result.status == 200 }}",
          qdrant: "{{ qdrant_health_result.status == 200 }}",
          redis: "{{ redis_ping_result.stdout | default('') in ['PONG', 'pong'] }}"
        }

    - name: Zeige Verifikationsbericht
      ansible.builtin.debug:
        var: verify_checks

    - name: Breche bei verfehltem Verifikationsziel ab
      ansible.builtin.fail:
        msg: >-
          Verifikation fehlgeschlagen (OP59b): {{ verify_checks | to_nice_yaml }}
          Ohne diese Checks ist die Plattform nicht einsatzbereit.
          Diagnose: systemctl status {{ service_name }} -l;
          docker ps; docker logs nir_ollama; curl http://127.0.0.1:8000/.
      when: verify_checks | dict2items | selectattr('value', 'equalto', false) | list | length > 0

    - name: Installation erfolgreich verifiziert (OP59b)
      ansible.builtin.debug:
        msg: >-
          NIR Intelligence Main Release: Installation verifiziert
          (Methode: {{ install_method }}) - Django antwortet auf
          http://127.0.0.1:8000, Ollama mit Modell '{{ llm_model }}',
          Qdrant und Redis sind aktiv. Alle Checks gruen.
