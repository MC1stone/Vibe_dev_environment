# Ansible Inventory for Ventoy Stick Setup
# This inventory file defines the target systems for Django + Port Agent deployment

[ventoy_stick]
# This would be the Ventoy stick when booted
# For local testing, use localhost
localhost ansible_connection=local

# For remote Ventoy stick (when booted and accessible via SSH)
# ventoy_host ansible_host=192.168.1.100 ansible_user=ventoy_user

[ventoy_stick:vars]
# Global variables for Ventoy stick setup
ansible_python_interpreter=/usr/bin/python3
project_name=nir_mistral
project_root=/home/martin/Development/vsCode_Environment/NIR_Mistral
deploy_root=/opt/{{ project_name }}
venv_name=venv
venv_path={{ deploy_root }}/{{ venv_name }}
django_project_path={{ deploy_root }}/django_project
port_agent_path={{ deploy_root }}/agents/port_agent

# Django settings
django_settings_module=nir_web.settings
django_secret_key=your-secret-key-here-change-in-production
django_debug=False
django_allowed_hosts="['*']"
django_port=8000

# Port Agent settings
port_agent_port=8001
port_manager_enabled=True

# System settings
create_swap_file=True
swap_file_size=2G
install_dependencies=True

# Ventoy-specific settings
ventoy_mount_point=/mnt/ventoy
ventoy_iso_path={{ deploy_root }}/ventoy
ventoy_version=1.0.96

# Service settings
create_systemd_services=True
service_user={{ project_name }}
service_group={{ project_name }}

# Network settings
firewall_enabled=False
open_ports=[8000, 8001, 8080, 5432, 6379, 9200]

# Docker settings (optional)
docker_enabled=False
install_docker=False

# Monitoring settings
install_monitoring=False
monitoring_port=9090

[django_servers]
# Django server targets
django_server ansible_host=localhost ansible_connection=local

[django_servers:vars]
# Django-specific variables
django_bind_address=0.0.0.0
django_workers=4
django_timeout=300

[port_agent_servers]
# Port Agent server targets
port_agent_server ansible_host=localhost ansible_connection=local

[port_agent_servers:vars]
# Port Agent-specific variables
port_agent_bind_address=0.0.0.0
port_agent_workers=2
port_agent_timeout=60

# Combined group for full deployment
[full_deployment:children]
ventoy_stick
django_servers
port_agent_servers

[full_deployment:vars]
# Full deployment variables
deploy_everything=True
run_migrations=True
collect_static=True
create_superuser=False
superuser_username=admin
superuser_email=admin@nir-mistral.local
superuser_password=admin123

# Development vs Production
[development:children]
ventoy_stick

[development:vars]
django_debug=True
install_dev_tools=True

[production:children]
ventoy_stick

[production:vars]
django_debug=False
install_dev_tools=False
create_swap_file=True
firewall_enabled=True