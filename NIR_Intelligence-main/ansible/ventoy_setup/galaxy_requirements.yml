# Ansible Galaxy Collections Requirements for NIR_Mistral
# These collections provide additional modules used in the playbooks

collections:
  # Community collections
  - name: community.general
    version: ">=6.0.0"
    
  - name: community.postgresql
    version: ">=3.0.0"
    
  - name: community.docker
    version: ">=3.0.0"
    
  # Monitoring collections
  - name: prometheus.prometheus
    version: ">=1.0.0"
    
  # System collections
  - name: ansible.posix
    version: ">=1.4.0"
    
  # Cloud collections (for potential future expansion)
  - name: cloud.common
    version: ">=2.0.0"