---
# System Preparation Role for Ventoy Stick Setup
#
# This role prepares the base system for Django + Port Agent deployment.
# It handles:
# - System updates and upgrades
# - Required package installation
# - Python and pip setup
# - User and group creation
# - Swap file configuration
# - Firewall configuration
# - Timezone and locale settings
# System Preparation Tasks
- name: Update apt package index (Debian/Ubuntu)
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  tags: [system, packages, update]

- name: Upgrade all packages (Debian/Ubuntu)
  apt:
    upgrade: dist
    autoremove: yes
  when: ansible_facts['os_family'] == 'Debian'
  tags: [system, packages, upgrade]

- name: Install critical base packages (Debian/Ubuntu)
  apt:
    name:
      - curl
      - wget
      - git
      - build-essential
      - python3
      - python3-dev
      - python3-pip
      - python3-venv
      - python3-wheel
      - libpq-dev
      - libffi-dev
      - libssl-dev
      - libxml2-dev
      - libxslt1-dev
      - zlib1g-dev
      - net-tools
      - lsof
      - htop
      - tmux
      - screen
      - tree
      - unzip
      - zip
      - tar
      - gzip
      - bzip2
      - jq
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: [system, packages, dependencies]

- name: Install libyaml-dev if available (Debian/Ubuntu)
  apt:
    name: libyaml-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  ignore_errors: yes
  tags: [system, packages, dependencies]

- name: Install optional packages (Debian/Ubuntu) - may fail on newer versions
  apt:
    name:
      - iftop
      - iotop
      - yq
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  ignore_errors: yes
  tags: [system, packages, optional]

- name: Install critical base packages (RedHat/CentOS)
  yum:
    name:
      - curl
      - wget
      - git
      - gcc
      - gcc-c++
      - python3
      - python3-devel
      - python3-pip
      - python3-wheel
      - postgresql-devel
      - openssl-devel
      - libyaml-devel
      - libxml2-devel
      - libxslt-devel
      - zlib-devel
      - net-tools
      - lsof
      - htop
      - tmux
      - screen
      - tree
      - unzip
      - zip
      - tar
      - gzip
      - bzip2
      - jq
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: [system, packages, dependencies]

- name: Install optional packages (RedHat/CentOS) - may fail on newer versions
  yum:
    name:
      - iftop
      - iotop
      - yq
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  ignore_errors: yes
  tags: [system, packages, optional]

- name: Install EPEL repository (RedHat/CentOS)
  yum:
    name: epel-release
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: [system, packages, repositories]

- name: Skip system-wide pip updates for Debian 13.6+ (PEP 668)
  debug:
    msg: "Skipping system-wide pip updates due to PEP 668 externally-managed environment. Python packages will be installed in virtual environments."
  when: ansible_facts['os_family'] == 'Debian' and ansible_distribution_version is version('13', '>=')
  tags: [system, python, pip, pep668]

- name: Ensure pip is up to date (non-Debian 13.6+ or with override)
  pip:
    name: pip
    state: latest
    executable: pip3
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  when: ansible_facts['os_family'] != 'Debian' or ansible_distribution_version is not version('13', '>=')
  ignore_errors: yes
  tags: [system, python, pip]

- name: Install Python virtualenv via pip (non-Debian 13.6+ or with override)
  pip:
    name: virtualenv
    state: latest
    executable: pip3
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  when: ansible_facts['os_family'] != 'Debian' or ansible_distribution_version is not version('13', '>=')
  ignore_errors: yes
  tags: [system, python, virtualenv]

- name: Install Python build dependencies via pip (non-Debian 13.6+ or with override)
  pip:
    name:
      - setuptools
      - wheel
      - build
      - twine
    state: latest
    executable: pip3
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  when: ansible_facts['os_family'] != 'Debian' or ansible_distribution_version is not version('13', '>=')
  ignore_errors: yes
  tags: [system, python, build]


# User and Group Management
- name: Create deployment group
  group:
    name: "{{ service_group }}"
    state: present
    system: yes
  tags: [system, users]

- name: Create deployment user
  user:
    name: "{{ service_user }}"
    group: "{{ service_group }}"
    home: "{{ deploy_root }}"
    shell: /bin/bash
    system: yes
    create_home: yes
    state: present
  tags: [system, users]

- name: Set ownership of deployment directory
  file:
    path: "{{ deploy_root }}"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0755'
    recurse: yes
  tags: [system, permissions]


# Swap File Configuration
- name: Check if swap is already enabled
  command: swapon --show
  register: swap_check
  changed_when: false
  failed_when: false
  tags: [system, swap]

- name: Create swap file
  command: fallocate -l {{ swap_file_size }} /swapfile
  args:
    creates: /swapfile
  when: create_swap_file | default(true) and swap_check.stdout == ""
  tags: [system, swap]

- name: Set swap file permissions
  file:
    path: /swapfile
    mode: '0600'
  when: create_swap_file | default(true) and swap_check.stdout == ""
  tags: [system, swap]

- name: Format swap file
  command: mkswap /swapfile
  when: create_swap_file | default(true) and swap_check.stdout == ""
  tags: [system, swap]

- name: Enable swap file
  command: swapon /swapfile
  when: create_swap_file | default(true) and swap_check.stdout == ""
  tags: [system, swap]

- name: Make swap permanent
  lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present
  when: create_swap_file | default(true) and swap_check.stdout == ""
  tags: [system, swap]

- name: Tune swap settings
  sysctl:
    name: vm.swappiness
    value: '10'
    state: present
    reload: yes
  when: create_swap_file | default(true)
  tags: [system, swap]


# Timezone and Locale Configuration
- name: Set timezone to UTC
  timezone:
    name: UTC
  tags: [system, timezone]

- name: Configure locale settings
  locale_gen:
    name: en_US.UTF-8
    state: present
  tags: [system, locale]

- name: Set default locale
  lineinfile:
    path: /etc/default/locale
    line: 'LANG=en_US.UTF-8'
    state: present
    create: yes
  tags: [system, locale]


# Firewall Configuration
- name: Install UFW firewall (Debian/Ubuntu)
  apt:
    name: ufw
    state: present
  when: ansible_facts['os_family'] == 'Debian' and firewall_enabled | default(false)
  tags: [system, firewall]

- name: Install firewalld (RedHat/CentOS)
  yum:
    name: firewalld
    state: present
  when: ansible_facts['os_family'] == 'RedHat' and firewall_enabled | default(false)
  tags: [system, firewall]

- name: Enable UFW firewall (Debian/Ubuntu)
  ufw:
    state: enabled
    policy: allow
  when: ansible_facts['os_family'] == 'Debian' and firewall_enabled | default(false)
  tags: [system, firewall]

- name: Allow ports through UFW (Debian/Ubuntu)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ open_ports }}"
  when: ansible_facts['os_family'] == 'Debian' and firewall_enabled | default(false)
  tags: [system, firewall]

- name: Enable and start firewalld (RedHat/CentOS)
  systemd:
    name: firewalld
    enabled: yes
    state: started
  when: ansible_facts['os_family'] == 'RedHat' and firewall_enabled | default(false)
  tags: [system, firewall]

- name: Allow ports through firewalld (RedHat/CentOS)
  firewalld:
    port: "{{ item }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ open_ports }}"
  when: ansible_facts['os_family'] == 'RedHat' and firewall_enabled | default(false)
  tags: [system, firewall]


# System Limits Configuration
- name: Configure system limits for Django
  pam_limits:
    domain: "{{ service_user }}"
    limit_type: soft
    limit_item: nofile
    value: 65535
  tags: [system, limits]

- name: Configure system limits for Django (hard)
  pam_limits:
    domain: "{{ service_user }}"
    limit_type: hard
    limit_item: nofile
    value: 65535
  tags: [system, limits]

- name: Configure process limits
  pam_limits:
    domain: "{{ service_user }}"
    limit_type: soft
    limit_item: nproc
    value: 4096
  tags: [system, limits]

- name: Configure process limits (hard)
  pam_limits:
    domain: "{{ service_user }}"
    limit_type: hard
    limit_item: nproc
    value: 8192
  tags: [system, limits]


# System Optimization (skipped due to kernel parameter availability issues)
- name: Skip sysctl optimizations (not critical for Django/Port Agent)
  debug:
    msg: "Skipping sysctl kernel parameter optimizations as they are not critical for Django/Port Agent functionality"
  tags: [system, optimization, info]


# Docker Installation (Optional)
- name: Install Docker dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
  when: ansible_facts['os_family'] == 'Debian' and install_docker | default(false)
  tags: [system, docker, dependencies]

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    state: present
  when: ansible_facts['os_family'] == 'Debian' and install_docker | default(false)
  tags: [system, docker, repository]

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ ansible_architecture }}] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == 'Debian' and install_docker | default(false)
  tags: [system, docker, repository]

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: ansible_facts['os_family'] == 'Debian' and install_docker | default(false)
  tags: [system, docker, installation]

- name: Add user to docker group
  user:
    name: "{{ service_user }}"
    groups: docker
    append: yes
  when: install_docker | default(false)
  tags: [system, docker, users]

- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: yes
    state: started
  when: install_docker | default(false)
  tags: [system, docker, service]


# Final System Information
- name: Display system preparation summary
  debug:
    msg: |
      ============================================
      SYSTEM PREPARATION COMPLETE
      ============================================
      
      System Updates: ✅
      Base Packages: ✅
      Python Environment: ✅
      User Management: ✅
      Swap Configuration: {{ '✅' if create_swap_file | default(true) else '⏭️' }}
      Firewall Configuration: {{ '✅' if firewall_enabled | default(false) else '⏭️' }}
      System Limits: ✅
      System Optimization: ✅
      Docker Installation: {{ '✅' if install_docker | default(false) else '⏭️' }}
      
      Next: Django Server Setup
      ============================================
  tags: [system, summary]