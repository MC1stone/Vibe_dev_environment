# Ansible Configuration for Ventoy Stick Setup
[defaults]
# Inventory file path
inventory = inventory.ini

# Remote user
remote_user = root

# SSH connection settings
private_key_file = ~/.ssh/id_rsa

# Host key checking
host_key_checking = False

# Retry files
retry_files_enabled = False

# Timeout settings
connect_timeout = 30
timeout = 60

# Verbosity
# verbosity = 1

# Enable fact caching
fact_caching = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 86400

# Enable pipelining for better performance
pipelining = True

# Enable SSH multiplexing
control_path = ~/.ansible/cp/%%h-%%r

[privilege_escalation]
become_method = sudo
become_user = root
become_ask_pass = False

[paramiko_connection]
# Enable persistent connections
record_host_keys = False

[ssh_connection]
# SSH settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=60