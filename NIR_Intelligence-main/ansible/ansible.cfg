# Ansible Configuration for NIR_Mistral DeveloperAgent Framework
# This configuration optimizes Ansible for the NIR project deployment

[defaults]
# Inventory file
inventory = inventory/hosts.yml

# Enable roles, include tasks, etc.
roles_path = roles:../
library = library
module_utils = module_utils

# Remote user settings
remote_user = ubuntu
private_key_file = ~/.ssh/venty_stick_key

# SSH settings for Venty stick
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml

# Performance tuning
forks = 20
poll_interval = 15
timeout = 60

# Logging
log_path = logs/ansible.log

# Interpreter settings
interpreter_python = auto_silent

# Display settings
display_args_to_stdout = True
diff = True

# Callback plugins
callback_whitelist = profile_tasks,timer,mail

# Retry settings
retry_files_save_path = ~/.ansible-retry

[privilege_escalation]
become_method = sudo
become_user = root
become_ask_pass = False

[paramiko_connection]
record_host_keys = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=60
scp_if_ssh = True

[persistent_connection]
connect_timeout = 30
connect_retry_timeout = 180

# Custom callbacks for NIR project
[callbacks_enabled]
timer = True
profile_tasks = True
mail = False