# Ansible Inventory for NIR_Mistral DeveloperAgent Framework
# This inventory defines the Venty stick and other deployment targets

---
# Venty Stick Configuration (Primary deployment target)
venty_stick:
  hosts:
    venty-stick:
      ansible_host: 192.168.1.100  # Replace with actual Venty stick IP
      ansible_user: ubuntu
      ansible_ssh_private_key_file: ~/.ssh/venty_stick_key
      ansible_python_interpreter: /usr/bin/python3
      
      # Venty stick specific variables
      is_venty_stick: true
      deployment_type: "stick"
      storage_type: "usb"
      
      # Framework configuration
      framework_version: "1.0.0"
      project_name: "NIR_Mistral"
      
      # Docker configuration for Venty stick
      docker_enabled: true
      docker_compose_version: "2.24.0"
      
      # Service ports
      framework_port: 8080
      api_port: 8000
      monitoring_port: 9090

# Development Servers (Optional)
development_servers:
  hosts:
    dev-server-1:
      ansible_host: 192.168.1.101
      ansible_user: ubuntu
      deployment_type: "server"
      storage_type: "ssd"
      
    dev-server-2:
      ansible_host: 192.168.1.102
      ansible_user: ubuntu
      deployment_type: "server"
      storage_type: "ssd"

# Database Servers
database_servers:
  hosts:
    postgres-server:
      ansible_host: 192.168.1.103
      ansible_user: ubuntu
      deployment_type: "database"
      
    weaviate-server:
      ansible_host: 192.168.1.104
      ansible_user: ubuntu
      deployment_type: "vector_db"

# Monitoring and Logging
monitoring:
  hosts:
    prometheus-server:
      ansible_host: 192.168.1.105
      ansible_user: ubuntu
      
    grafana-server:
      ansible_host: 192.168.1.106
      ansible_user: ubuntu

# Group all servers for global operations
all_servers:
  children:
    venty_stick:
    development_servers:
    database_servers:
    monitoring:

# Special groups for specific operations
framework_servers:
  children:
    venty_stick:
    development_servers:

# Docker hosts
docker_hosts:
  children:
    venty_stick:
    development_servers:

# Database hosts
db_hosts:
  children:
    database_servers:

# Monitoring hosts
monitoring_hosts:
  children:
    monitoring: