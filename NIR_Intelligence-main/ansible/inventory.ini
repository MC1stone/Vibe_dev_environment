# NIR_Mistral Inventory File
# Deployment inventory for NIR Intelligence Platform

[nir_servers]
# Main NIR application servers
nir-app-01 ansible_host=192.168.1.100 ansible_user=ubuntu
nir-app-02 ansible_host=192.168.1.101 ansible_user=ubuntu

[database_servers]
# Database servers
nir-db-01 ansible_host=192.168.1.110 ansible_user=ubuntu
nir-db-02 ansible_host=192.168.1.111 ansible_user=ubuntu

[web_servers]
# Web frontend servers
nir-web-01 ansible_host=192.168.1.120 ansible_user=ubuntu
nir-web-02 ansible_host=192.168.1.121 ansible_user=ubuntu

[ilias_servers]
# ILIAS integration servers
nir-ilias-01 ansible_host=192.168.1.130 ansible_user=ubuntu

[federated_servers]
# Federated learning servers
nir-federated-01 ansible_host=192.168.1.140 ansible_user=ubuntu
nir-federated-02 ansible_host=192.168.1.141 ansible_user=ubuntu

[development]
# Development and testing servers
nir-dev-01 ansible_host=192.168.1.200 ansible_user=ubuntu
nir-test-01 ansible_host=192.168.1.201 ansible_user=ubuntu

[ventoy_deployment]
# Ventoy-based deployment targets (USB sticks)
ventoy-usb-01 ansible_host=192.168.1.50 ansible_user=ventoy
ventoy-usb-02 ansible_host=192.168.1.51 ansible_user=ventoy

[local]
# Local development
localhost ansible_connection=local

# Group definitions
[all_servers:children]
nir_servers
database_servers
web_servers
ilias_servers
federated_servers

[production:children]
nir_servers
database_servers
web_servers
ilias_servers
federated_servers

[staging:children]
development

# Ventoy-specific groups
[ventoy:children]
ventoy_deployment

# Connection variables
[nir_servers:vars]
ansible_ssh_private_key_file=~/.ssh/nir_mistral_key
ansible_ssh_common_args='-o ServerAliveInterval=60 -o ControlMaster=auto -o ControlPersist=60s'

[ventoy_deployment:vars]
ansible_ssh_private_key_file=~/.ssh/ventoy_key
ansible_ssh_common_args='-o ServerAliveInterval=30'

# Environment variables
[production:vars]
environment=production
app_version=2.0.0
deploy_user=nir-app
log_level=INFO

[staging:vars]
environment=staging
app_version=2.0.0-dev
deploy_user=nir-dev
log_level=DEBUG

[development:vars]
environment=development
app_version=2.0.0-dev
deploy_user=nir-dev
log_level=DEBUG