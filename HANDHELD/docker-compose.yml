version: "3.9"

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: spectral-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    networks:
      - spectral-net

  nodered:
    image: nodered/node-red:latest
    container_name: spectral-nodered
    depends_on:
      - mqtt
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./nodered/data:/data
    networks:
      - spectral-net

  django:
    build:
      context: ./django_platform
      dockerfile: Dockerfile
    container_name: spectral-django
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MCP_SERVER_URL=http://mcp-server:8001
    volumes:
      - ./django_platform:/app
    ports:
      - "8000:8000"
    depends_on:
      - mqtt
      - mcp-server
    networks:
      - spectral-net

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: spectral-mcp
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - HOST=0.0.0.0
      - PORT=8001
    command: uvicorn server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - mqtt
    networks:
      - spectral-net

  napari-server:
    build:
      context: ./napari_app
      dockerfile: Dockerfile
    container_name: spectral-napari-server
    environment:
      - QT_QPA_PLATFORM=offscreen
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - DJANGO_API_URL=http://django:8000
      - NAPARI_SERVER_PORT=8002
    command: python app.py
    ports:
      - "8002:8002"
    depends_on:
      - mqtt
      - django
    volumes:
      - ./napari_app:/app
    networks:
      - spectral-net

networks:
  spectral-net:
    driver: bridge

volumes:
  mqtt_data:
  mqtt_log:
