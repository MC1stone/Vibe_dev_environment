<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica,Arial,sans-serif">
  <style>.comp{fill:#eef4fb;stroke:#2b6cb0;stroke-width:1.5}.db{fill:#eaf7ee;stroke:#2e7d32;stroke-width:1.5}.ui{fill:#fdf3e0;stroke:#b8860b;stroke-width:1.5}.h{font-size:14px;font-weight:bold}.b{font-size:11.5px}.m{font-size:10px;fill:#555}.grp{fill:none;stroke:#888;stroke-dasharray:6,4}</style>
  <text x="450" y="26" text-anchor="middle" class="h">NIR-IP Sensor Database (Section 3.2): what the platform knows about every device</text>
  <rect x="20" y="46" width="860" height="150" class="grp" rx="10"/>
  <text x="34" y="66" class="b" font-weight="bold">Layer 1 — Registered adapters (devices/ registry, no core changes per device)</text>
  <rect x="40" y="76" width="200" height="92" class="comp" rx="6"/><text x="140" y="98" text-anchor="middle" class="b">SparkFun Triad (AS7265x)</text><text x="140" y="114" text-anchor="middle" class="m">18 fixed bands 410–940 nm</text><text x="140" y="128" text-anchor="middle" class="m">I2C/UART · in use (PoC)</text><text x="140" y="142" text-anchor="middle" class="m">adapter profile: capabilities,</text><text x="140" y="156" text-anchor="middle" class="m">calibration contract</text>
  <rect x="255" y="76" width="200" height="92" class="comp" rx="6"/><text x="355" y="98" text-anchor="middle" class="b">ESP32-S3 camera spectrometer</text><text x="355" y="114" text-anchor="middle" class="m">DIY grating + camera</text><text x="355" y="128" text-anchor="middle" class="m">WiFi/USB · registered</text><text x="355" y="142" text-anchor="middle" class="m">adapter profile: capabilities,</text><text x="355" y="156" text-anchor="middle" class="m">calibration contract</text>
  <rect x="470" y="76" width="200" height="92" class="comp" rx="6"/><text x="570" y="98" text-anchor="middle" class="b">DIY Matchbox spectrometer</text><text x="570" y="114" text-anchor="middle" class="m">slit-and-grating, smartphone</text><text x="570" y="128" text-anchor="middle" class="m">serial · registered</text><text x="570" y="142" text-anchor="middle" class="m">adapter profile: capabilities,</text><text x="570" y="156" text-anchor="middle" class="m">calibration contract</text>
  <rect x="685" y="76" width="200" height="92" class="comp" rx="6"/><text x="785" y="98" text-anchor="middle" class="b">Any further device</text><text x="785" y="114" text-anchor="middle" class="m">implement SpectrometerAdapter,</text><text x="785" y="128" text-anchor="middle" class="m">register MODEL_ID — done</text><text x="785" y="142" text-anchor="middle" class="m">no platform-core change,</text><text x="785" y="156" text-anchor="middle" class="m">no format hard-coding</text>
  <rect x="20" y="216" width="860" height="130" class="grp" rx="10"/>
  <text x="34" y="236" class="b" font-weight="bold">Layer 2 — Usage from the existing database (no new tables)</text>
  <rect x="40" y="246" width="260" height="70" class="db" rx="6"/><text x="170" y="268" text-anchor="middle" class="b">Spectrum database</text><text x="170" y="284" text-anchor="middle" class="m">instrument_type per spectrum record</text><text x="170" y="298" text-anchor="middle" class="m">→ spectra / projects / last used</text>
  <rect x="320" y="246" width="260" height="70" class="db" rx="6"/><text x="450" y="268" text-anchor="middle" class="b">Preparation reports + crew results</text><text x="450" y="284" text-anchor="middle" class="m">recorded settings per measurement</text><text x="450" y="298" text-anchor="middle" class="m">→ optimization suggestions</text>
  <rect x="600" y="246" width="280" height="70" class="db" rx="6"/><text x="740" y="268" text-anchor="middle" class="b">Unmatched names → AI match suggestions</text><text x="740" y="284" text-anchor="middle" class="m">"SparkFun Triad" vs. "Triad": the agent asks,</text><text x="740" y="298" text-anchor="middle" class="m">never silently deduplicates</text>
  <rect x="20" y="366" width="860" height="110" class="grp" rx="10"/>
  <text x="34" y="386" class="b" font-weight="bold">Layer 3 — Per-sensor information page (/projects/sensors/&lt;name&gt;/)</text>
  <rect x="40" y="396" width="200" height="66" class="ui" rx="6"/><text x="140" y="418" text-anchor="middle" class="b">Adapter profile</text><text x="140" y="434" text-anchor="middle" class="m">range, detector, interface,</text><text x="140" y="448" text-anchor="middle" class="m">resolution, streaming, trigger</text>
  <rect x="255" y="396" width="200" height="66" class="ui" rx="6"/><text x="355" y="418" text-anchor="middle" class="b">Recorded settings</text><text x="355" y="434" text-anchor="middle" class="m">values + completeness /</text><text x="355" y="448" text-anchor="middle" class="m">plausibility assessment</text>
  <rect x="470" y="396" width="200" height="66" class="ui" rx="6"/><text x="570" y="418" text-anchor="middle" class="b">Documents</text><text x="570" y="434" text-anchor="middle" class="m">datasheet, manual, calibration</text><text x="570" y="448" text-anchor="middle" class="m">certificate — any file type</text>
  <rect x="685" y="396" width="200" height="66" class="ui" rx="6"/><text x="785" y="418" text-anchor="middle" class="b">AI summary (local)</text><text x="785" y="434" text-anchor="middle" class="m">Ollama on request; honest</text><text x="785" y="448" text-anchor="middle" class="m">fallback when unavailable</text>
  <rect x="20" y="496" width="860" height="84" class="grp" rx="10"/>
  <text x="34" y="516" class="b" font-weight="bold">Feeds back into analysis</text>
  <rect x="40" y="526" width="260" height="40" class="comp" rx="6"/><text x="170" y="543" text-anchor="middle" class="b">Metadata plausibility</text><text x="170" y="558" text-anchor="middle" class="m">known max values (e.g. scan count ≤ 100)</text>
  <rect x="320" y="526" width="260" height="40" class="comp" rx="6"/><text x="450" y="543" text-anchor="middle" class="b">Fusion reference contract</text><text x="450" y="558" text-anchor="middle" class="m">dark/white, ≥ 50 repetitions (§6.7)</text>
  <rect x="600" y="526" width="280" height="40" class="comp" rx="6"/><text x="740" y="543" text-anchor="middle" class="b">Intro page: device-specific guidance</text><text x="740" y="558" text-anchor="middle" class="m">teaches the same protocol the fusion branch enforces</text>
</svg>
