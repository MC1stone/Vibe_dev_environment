<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica,Arial,sans-serif">
  <style>.comp{fill:#eef4fb;stroke:#2b6cb0;stroke-width:1.5}.db{fill:#eaf7ee;stroke:#2e7d32;stroke-width:1.5}.ui{fill:#fdf3e0;stroke:#b8860b;stroke-width:1.5}.ok{fill:#e8f8e8;stroke:#2e7d32;stroke-width:1.5}.warn{fill:#fdeaea;stroke:#c0392b;stroke-width:1.5}.h{font-size:14px;font-weight:bold}.b{font-size:11.5px}.m{font-size:10px;fill:#555}.grp{fill:none;stroke:#888;stroke-dasharray:6,4}</style>
  <text x="450" y="26" text-anchor="middle" class="h">NIR-IP Standardized Test Unit (Section 6.7): the reference-measurement protocol contract</text>
  <rect x="20" y="46" width="860" height="120" class="grp" rx="10"/>
  <text x="34" y="66" class="b" font-weight="bold">Contract — a measurement condition, not a device (sensor-agnostic)</text>
  <rect x="40" y="76" width="260" height="76" class="ui" rx="6"/><text x="170" y="98" text-anchor="middle" class="b">DARK reference</text><text x="170" y="114" text-anchor="middle" class="m">metadata: reference_type = "dark",</text><text x="170" y="128" text-anchor="middle" class="m">artifact, ≥ 50 repetitions</text><text x="170" y="142" text-anchor="middle" class="m">dataset_type = reference_measurement</text>
  <rect x="320" y="76" width="260" height="76" class="ui" rx="6"/><text x="450" y="98" text-anchor="middle" class="b">WHITE reference</text><text x="450" y="114" text-anchor="middle" class="m">metadata: reference_type = "white",</text><text x="450" y="128" text-anchor="middle" class="m">artifact, ≥ 50 repetitions</text><text x="450" y="142" text-anchor="middle" class="m">dataset_type = reference_measurement</text>
  <rect x="600" y="76" width="280" height="76" class="ui" rx="6"/><text x="740" y="98" text-anchor="middle" class="b">Declared as metadata at ingestion</text><text x="740" y="114" text-anchor="middle" class="m">no specific hardware prescribed;</text><text x="740" y="128" text-anchor="middle" class="m">reference datasets NEVER enter a</text><text x="740" y="142" text-anchor="middle" class="m">calibration — they are not samples</text>
  <rect x="20" y="186" width="860" height="110" class="grp" rx="10"/>
  <text x="34" y="206" class="b" font-weight="bold">Radiometric evaluation (per channel, per source)</text>
  <rect x="40" y="216" width="260" height="66" class="comp" rx="6"/><text x="170" y="238" text-anchor="middle" class="b">Transfer function</text><text x="170" y="254" text-anchor="middle" class="m">reflectance = (raw − dark) /</text><text x="170" y="268" text-anchor="middle" class="m">(white − dark), per channel</text>
  <rect x="320" y="216" width="260" height="66" class="comp" rx="6"/><text x="450" y="238" text-anchor="middle" class="b">Gain curve</text><text x="450" y="254" text-anchor="middle" class="m">smoothed over the wavelength axis;</text><text x="450" y="268" text-anchor="middle" class="m">confidence note from repetition spread</text>
  <rect x="600" y="216" width="280" height="66" class="comp" rx="6"/><text x="740" y="238" text-anchor="middle" class="b">Compliance check (sensor quality agent)</text><text x="740" y="254" text-anchor="middle" class="m">type + artifact + n ≥ 50 verified per source</text><text x="740" y="268" text-anchor="middle" class="m">before the gain curve is offered</text>
  <rect x="20" y="316" width="860" height="130" class="grp" rx="10"/>
  <text x="34" y="336" class="b" font-weight="bold">Role in the fusion correction loop (Section 6.7)</text>
  <rect x="40" y="346" width="260" height="86" class="ok" rx="6"/><text x="170" y="368" text-anchor="middle" class="b">Contract met</text><text x="170" y="384" text-anchor="middle" class="m">gain curve offered as an additional</text><text x="170" y="398" text-anchor="middle" class="m">correction variant (SNV, MSC, gain);</text><text x="170" y="412" text-anchor="middle" class="m">identical CV pipeline re-run on</text><text x="170" y="426" text-anchor="middle" class="m">corrected data → corrected verdict</text>
  <rect x="320" y="346" width="260" height="86" class="warn" rx="6"/><text x="450" y="368" text-anchor="middle" class="b">Contract not met</text><text x="450" y="384" text-anchor="middle" class="m">gain curve honestly reported as</text><text x="450" y="398" text-anchor="middle" class="m">"not estimable", with the protocol text;</text><text x="450" y="412" text-anchor="middle" class="m">it is never simulated — the tomato</text><text x="450" y="426" text-anchor="middle" class="m">sources are the documented case</text>
  <rect x="600" y="346" width="280" height="86" class="comp" rx="6"/><text x="740" y="368" text-anchor="middle" class="b">Common radiometric scale</text><text x="740" y="384" text-anchor="middle" class="m">any device that measures the two references</text><text x="740" y="398" text-anchor="middle" class="m">can be placed on one scale — without</text><text x="740" y="412" text-anchor="middle" class="m">centralizing raw spectra; scales to every</text><text x="740" y="426" text-anchor="middle" class="m">future sensor in the growing database</text>
  <rect x="20" y="466" width="860" height="130" class="grp" rx="10"/>
  <text x="34" y="486" class="b" font-weight="bold">Why a test unit matters in the public sector</text>
  <rect x="40" y="496" width="260" height="86" class="db" rx="6"/><text x="170" y="518" text-anchor="middle" class="b">Comparability</text><text x="170" y="534" text-anchor="middle" class="m">municipal labs, schools and citizen</text><text x="170" y="548" text-anchor="middle" class="m">groups measure on different devices;</text><text x="170" y="562" text-anchor="middle" class="m">the contract makes results comparable</text>
  <rect x="320" y="496" width="260" height="86" class="db" rx="6"/><text x="450" y="518" text-anchor="middle" class="b">Teachability</text><text x="450" y="534" text-anchor="middle" class="m">the intro page teaches exactly this</text><text x="450" y="548" text-anchor="middle" class="m">protocol; one procedure, every device</text><text x="450" y="562" text-anchor="middle" class="m">— the same contract fusion enforces</text>
  <rect x="600" y="496" width="280" height="86" class="db" rx="6"/><text x="740" y="518" text-anchor="middle" class="b">Trust without certification</text><text x="740" y="534" text-anchor="middle" class="m">no certified reference material is needed:</text><text x="740" y="548" text-anchor="middle" class="m">dark/white are reproducible by anyone, and</text><text x="740" y="562" text-anchor="middle" class="m">the repetition spread states the confidence</text>
</svg>
