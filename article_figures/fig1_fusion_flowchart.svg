<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <style>.box{fill:#e8f1fb;stroke:#2b6cb0;stroke-width:1.5;rx:8}.dec{fill:#fff6e0;stroke:#b8860b;stroke-width:1.5}.warn{fill:#fdeaea;stroke:#c0392b;stroke-width:1.5}.ok{fill:#e8f8e8;stroke:#2e7d32;stroke-width:1.5}.lbl{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.tit{font-size:14px;font-weight:bold;fill:#111}</style>
  <text x="410" y="24" text-anchor="middle" class="tit">NIR-IP Fusion Branch: Review-Governed Workflow (Section 6.7)</text>
  <rect x="270" y="40" width="280" height="44" class="box" rx="8"/>
  <text x="410" y="58" text-anchor="middle" class="lbl">Similarity search: hits from</text>
  <text x="410" y="74" text-anchor="middle" class="lbl">ANOTHER project</text>
  <line x1="410" y1="84" x2="410" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="250" y="110" width="320" height="44" class="box" rx="8"/>
  <text x="410" y="128" text-anchor="middle" class="lbl">Field-wise metadata comparison</text>
  <text x="410" y="144" text-anchor="middle" class="small">(generic — no domain hard-coding, OP65b)</text>
  <line x1="410" y1="154" x2="410" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="230" y="180" width="360" height="52" class="box" rx="8"/>
  <text x="410" y="200" text-anchor="middle" class="lbl">Fusion into a NEW project</text>
  <text x="410" y="218" text-anchor="middle" class="small">originals untouched · double-fusion guard (422)</text>
  <line x1="410" y1="232" x2="410" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="180" y="258" width="460" height="60" class="box" rx="8"/>
  <text x="410" y="278" text-anchor="middle" class="lbl">Comparative calibration: 3 × PLS + significance test</text>
  <text x="410" y="296" text-anchor="middle" class="small">source A · source B · combined — Levene (variance) + Welch (means)</text>
  <line x1="410" y1="318" x2="410" y2="346" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="300" y="346" width="220" height="42" class="dec" rx="21"/>
  <text x="410" y="372" text-anchor="middle" class="lbl">Residual heterogeneity?</text>
  <line x1="240" y1="367" x2="300" y2="367" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="130" y="363" text-anchor="middle" class="lbl">no</text>
  <rect x="40" y="346" width="180" height="42" class="ok" rx="8"/>
  <text x="130" y="372" text-anchor="middle" class="lbl">Fusion verdict: gain</text>
  <line x1="520" y1="367" x2="580" y2="367" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="550" y="363" text-anchor="middle" class="lbl">yes</text>
  <rect x="580" y="346" width="210" height="42" class="warn" rx="8"/>
  <text x="685" y="365" text-anchor="middle" class="lbl">Correction loop (OP68)</text>
  <text x="685" y="380" text-anchor="middle" class="small">SNV · MSC · gain curve*</text>
  <line x1="685" y1="388" x2="685" y2="416" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="530" y="416" width="310" height="64" class="box" rx="8"/>
  <text x="685" y="436" text-anchor="middle" class="lbl">Re-evaluation on corrected data —</text>
  <text x="685" y="452" text-anchor="middle" class="lbl">automatically formulated corrected verdict</text>
  <text x="685" y="470" text-anchor="middle" class="small">(first-class negative results, never simulated)</text>
  <line x1="685" y1="480" x2="685" y2="508" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="470" y="508" width="430" height="76" class="dec" rx="8"/>
  <text x="685" y="528" text-anchor="middle" class="lbl">Corrected fusion ≥ best single source?</text>
  <text x="685" y="546" text-anchor="middle" class="small">yes → fusion is an option · no → calibrate per source</text>
  <text x="685" y="562" text-anchor="middle" class="small">→ reference protocol (dark/white ≥ 50) → re-fuse</text>
  <text x="410" y="625" text-anchor="middle" class="small">* gain curve requires compliant dark/white reference measurements (reference protocol contract)</text>
</svg>
