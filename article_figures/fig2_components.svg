<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica,Arial,sans-serif">
  <style>.comp{fill:#eef4fb;stroke:#2b6cb0;stroke-width:1.5}.db{fill:#eaf7ee;stroke:#2e7d32;stroke-width:1.5}.ui{fill:#fdf3e0;stroke:#b8860b;stroke-width:1.5}.h{font-size:14px;font-weight:bold}.b{font-size:11.5px}.m{font-size:10px;fill:#555}.grp{fill:none;stroke:#888;stroke-dasharray:6,4}</style>
  <text x="450" y="26" text-anchor="middle" class="h">NIR-IP Platform: Components &amp; Capabilities (Articles §3)</text>
  <rect x="20" y="50" width="860" height="180" class="grp" rx="10"/>
  <text x="34" y="70" class="b" font-weight="bold">Analysis Agents (CrewAI-orchestrated, every project run)</text>
  <rect x="40" y="80" width="150" height="64" class="comp" rx="6"/><text x="115" y="102" text-anchor="middle" class="b">Metadata Agent</text><text x="115" y="118" text-anchor="middle" class="m">FAIR / ISO 19115</text><text x="115" y="132" text-anchor="middle" class="m">scorecard, dialogue</text>
  <rect x="205" y="80" width="150" height="64" class="comp" rx="6"/><text x="280" y="102" text-anchor="middle" class="b">Sensor Quality</text><text x="280" y="118" text-anchor="middle" class="m">noise, drift, SNR,</text><text x="280" y="132" text-anchor="middle" class="m">ADC, autoencoder</text>
  <rect x="370" y="80" width="150" height="64" class="comp" rx="6"/><text x="445" y="102" text-anchor="middle" class="b">Statistical Analysis</text><text x="445" y="118" text-anchor="middle" class="m">PCA · PLS · PCR</text><text x="445" y="132" text-anchor="middle" class="m">ANOVA · clustering</text>
  <rect x="535" y="80" width="150" height="64" class="comp" rx="6"/><text x="610" y="102" text-anchor="middle" class="b">Neural Network</text><text x="610" y="118" text-anchor="middle" class="m">CNN · MLP · AE</text><text x="610" y="132" text-anchor="middle" class="m">always parallel</text>
  <rect x="700" y="80" width="150" height="64" class="comp" rx="6"/><text x="775" y="102" text-anchor="middle" class="b">Calibration</text><text x="775" y="118" text-anchor="middle" class="m">6 methods, RMSECV,</text><text x="775" y="132" text-anchor="middle" class="m">RPD, equation</text>
  <rect x="40" y="152" width="150" height="60" class="comp" rx="6"/><text x="115" y="174" text-anchor="middle" class="b">FAISS / Qdrant</text><text x="115" y="190" text-anchor="middle" class="m">similarity search</text><text x="115" y="204" text-anchor="middle" class="m">→ fusion trigger</text>
  <rect x="205" y="152" width="150" height="60" class="comp" rx="6"/><text x="280" y="174" text-anchor="middle" class="b">LLM Reasoning</text><text x="280" y="190" text-anchor="middle" class="m">Ollama/Mistral,</text><text x="280" y="204" text-anchor="middle" class="m">RAG chatbot (MO 10)</text>
  <rect x="370" y="152" width="150" height="60" class="comp" rx="6"/><text x="445" y="174" text-anchor="middle" class="b">Flower FL</text><text x="445" y="190" text-anchor="middle" class="m">FedAvg/FedProx, DP,</text><text x="445" y="204" text-anchor="middle" class="m">consent gate</text>
  <rect x="535" y="152" width="150" height="60" class="comp" rx="6"/><text x="610" y="174" text-anchor="middle" class="b">Quarto Reporting</text><text x="610" y="190" text-anchor="middle" class="m">charts, explanations,</text><text x="610" y="204" text-anchor="middle" class="m">iteration archive</text>
  <rect x="700" y="152" width="150" height="60" class="comp" rx="6"/><text x="775" y="174" text-anchor="middle" class="b">Sensor Catalog</text><text x="775" y="190" text-anchor="middle" class="m">adapters, settings,</text><text x="775" y="204" text-anchor="middle" class="m">reference contract</text>
  <rect x="20" y="250" width="860" height="130" class="grp" rx="10"/>
  <text x="34" y="270" class="b" font-weight="bold">Fusion Branch Services (OP63–OP71, fusion projects only)</text>
  <rect x="40" y="280" width="200" height="84" class="ui" rx="6"/><text x="140" y="302" text-anchor="middle" class="b">project_fusion</text><text x="140" y="318" text-anchor="middle" class="m">merge, provenance,</text><text x="140" y="332" text-anchor="middle" class="m">double-fusion guard,</text><text x="140" y="346" text-anchor="middle" class="m">metadata suggestions</text>
  <rect x="255" y="280" width="200" height="84" class="ui" rx="6"/><text x="355" y="302" text-anchor="middle" class="b">fusion_calibration</text><text x="355" y="318" text-anchor="middle" class="m">3× PLS + Levene/Welch,</text><text x="355" y="332" text-anchor="middle" class="m">hit quotas, PVR chart,</text><text x="355" y="346" text-anchor="middle" class="m">Brix band matrix</text>
  <rect x="470" y="280" width="200" height="84" class="ui" rx="6"/><text x="570" y="302" text-anchor="middle" class="b">fusion_sensor_analysis</text><text x="570" y="318" text-anchor="middle" class="m">sensor comparison,</text><text x="570" y="332" text-anchor="middle" class="m">confounding diagnosis,</text><text x="570" y="346" text-anchor="middle" class="m">gain curve (references)</text>
  <rect x="685" y="280" width="200" height="84" class="ui" rx="6"/><text x="785" y="302" text-anchor="middle" class="b">correction loop</text><text x="785" y="318" text-anchor="middle" class="m">SNV · MSC · gain curve,</text><text x="785" y="332" text-anchor="middle" class="m">corrected verdict,</text><text x="785" y="346" text-anchor="middle" class="m">chatbot context</text>
  <rect x="20" y="400" width="860" height="140" class="grp" rx="10"/>
  <text x="34" y="420" class="b" font-weight="bold">External References (validation only — never part of the app)</text>
  <rect x="40" y="430" width="260" height="56" class="db" rx="6"/><text x="170" y="452" text-anchor="middle" class="b">Orange reference workflow</text><text x="170" y="468" text-anchor="middle" class="m">PLS 0.622 · independent anchor (§2.1)</text>
  <rect x="320" y="430" width="260" height="56" class="db" rx="6"/><text x="450" y="452" text-anchor="middle" class="b">KNIME reference (incl. .knwf)</text><text x="450" y="468" text-anchor="middle" class="m">PLS 0.621 · fusion counter-check, correction variants</text>
  <rect x="600" y="430" width="260" height="56" class="db" rx="6"/><text x="730" y="452" text-anchor="middle" class="b">Deterministic test matrices</text><text x="730" y="468" text-anchor="middle" class="m">OP63–OP72 + FL1–FL6 + S9 in CI, all green</text>
</svg>
