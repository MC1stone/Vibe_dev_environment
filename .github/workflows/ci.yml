      - name: Django system check
        run: python django_project/manage.py check

  change-impact:
    # OP89: Change-Impact Test Gate — schnelle PR-Schleife. Wählt selbst
    # die betroffenen Testmatrizen + Workflow-Smoke aus dem Diff gegen
    # origin/main. Der Vollmatrix-Job oben bleibt Merge-Backstop.
    name: Change-impact test gate (OP89)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NIR_Intelligence-main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scipy scikit-learn pyyaml django pillow requests packaging djangorestframework djangorestframework-simplejwt django-cors-headers matplotlib h5py openpyxl pyarrow

      # OP92-Fix: Der Gate-Job hat KEINEN compilemessages-Step (nur der
      # Vollmatrix-Job oben hat ihn). Matrizen wie test_op49_sensor_diy.py
      # brauchen kompilierte .mo-Kataloge (gettext.translation crasht mit
      # FileNotFoundError ohne .mo). polib ist abhaengigkeitsfrei -> .mo
      # direkt aus den .po bauen, kein gettext/msgfmt noetig.
      - name: Compile i18n catalogs for gate (OP92)
        run: |
          pip install polib
          python -c "
          import polib, pathlib
          locale = pathlib.Path('django_project/locale')
          for po in sorted(locale.glob('*/LC_MESSAGES/django.po')):
              mo = po.with_suffix('.mo')
              polib.pofile(str(po)).save_as_mofile(str(mo))
              print(f'compiled {mo}')
          "

      - name: Fetch base branch for impact diff
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main || true

      - name: Run change-impact gate against origin/main
        run: python scripts/run_change_tests.py --base origin/main

      - name: Run OP89 gate matrix
        run: python tests/test_op89_change_impact_gate.py
