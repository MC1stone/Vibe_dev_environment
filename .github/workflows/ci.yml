name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-matrices:
    name: Offline test matrices
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NIR_Intelligence-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scipy scikit-learn pyyaml django pillow requests packaging djangorestframework djangorestframework-simplejwt django-cors-headers matplotlib h5py openpyxl pyarrow

      - name: Install gettext and compile i18n message catalogs (OP48)
        run: |
          # Robust gegen haengende APT-Mirrors (Vorfall 2026-10-07: azure-
          # Mirrors beantworteten noble-updates nicht -> 27min Timeout des
          # gesamten Jobs). gettext vorhanden -> skip; Installation mit
          # Timeout + klarem Fehler statt Endloswarten.
          if command -v msgfmt >/dev/null 2>&1; then
            echo "gettext already present - skipping apt install"
          else
            echo "installing gettext (with 5min mirror timeout)..."
            timeout 300 sudo apt-get update || echo "apt-get update had errors - continuing"
            timeout 300 sudo apt-get install -y gettext || {
              echo "::warning::gettext install failed (mirror problem?). compilemessages needs msgfmt - i18n compile may fail"
            }
          fi
          python django_project/manage.py compilemessages || echo "::warning::compilemessages failed (gettext missing?) - continuing, i18n tests will report"
      - name: Run offline test matrices (S3-S9, OP1-OP4, OP6-OP8)
        run: |
          python tests/test_s3_format_loaders.py
          python tests/test_s4_spectrometer_adapters.py
          python tests/test_s5_spectrum_similarity.py
          python tests/test_s6_chatbot.py
          python tests/test_s7_update_monitoring.py
          python tests/test_s8_ilias_integration.py
          python tests/test_s9_federated_learning.py
          python tests/test_fl1_flwr_runtime.py
          python tests/test_fl2_federated_calibration.py
          python tests/test_fl3_federated_privacy.py
          python tests/test_fl4_federated_ui.py
          python tests/test_fl5_federated_ilias.py
          python tests/test_fl6_deployment_ilias_agent.py
          python tests/test_op1_embedding_pipeline.py
          python tests/test_op2_ilias_token_flow.py
          python tests/test_op3_platform_ui.py
          python tests/test_op6_crewai_agents.py
          python tests/test_op4_update_lookups.py
          python tests/test_op7_crew_pipeline_bridge.py
          python tests/test_op8_crew_results_ui.py
          python tests/test_op9_mcp_data_agent.py
          python tests/test_op10_project_workflow.py
          python tests/test_fa1_password_change.py
          python tests/test_fa1_settings_repair.py
          python tests/test_op11_rendered_final_report.py
          python tests/test_op12_project_upload_ui.py
          python tests/test_op13_online_metadata_editing.py
          python tests/test_op14_agent_truthfulness.py
          python tests/test_op15_spectral_database.py
          python tests/test_op16_pca_charts.py
          python tests/test_op17_project_delete.py
          python tests/test_op18_cnn_agent.py
          python tests/test_op19_xai_charts.py
          python tests/test_op20_calibration_charts.py
          python tests/test_op21_sensor_dashboard.py
          python tests/test_op22_spectrum_similarity_charts.py
          python tests/test_op23_student_report.py
          python tests/test_op24_report_chatbot.py
          python tests/test_op25_website_cleanup.py
          python tests/test_op26_ansible_install.py
          python tests/test_op27_deb_package.py
          python tests/test_op28_file_type_agnostic.py
          python tests/test_op29_sensor_agent.py
          python tests/test_op30_archive_ingest.py
          python tests/test_op31_metadata_llm.py
          python tests/test_op32_metadata_relevance.py
          python tests/test_op33_derived_metadata.py
          python tests/test_op35_metadata_editor_report.py
          python tests/test_op36_target_agnostic.py
          python tests/test_op37_outlier_chatbot.py
          python tests/test_op38_spectrum_cleaned.py
          python tests/test_op39_equation_export_source.py
          python tests/test_op40_metadata_consistency_print.py
          python tests/test_op41_preflight_timeout.py
          python tests/test_op42_bootstrap_script.py
          python tests/test_op43_ventoy_stick.py
          python tests/test_op45_host_backend_stack.py
          python tests/test_op48_i18n.py
          python tests/test_op49_sensor_diy.py
          python tests/test_op50_ollama_startup.py
